name: FMED REV0 Regola 0

on:
  push:
    branches:
      - repair/rev0-regola0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regola0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ricostruzione-punto-zero:
    name: 0 · Ricostruzione Punto 0 controllata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch candidata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/rev0-regola0

      - name: Verifica ricostruzione già applicata
        id: marker
        shell: bash
        run: |
          if [ -f .fmed_pointzero_applied ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Recupera il Punto 0 preservato
        if: steps.marker.outputs.done != 'true'
        run: git fetch origin backup/rev0-punto0-0566931

      - name: Trasferisce soltanto moduli visuali approvati
        if: steps.marker.outputs.done != 'true'
        shell: bash
        run: |
          git checkout origin/backup/rev0-punto0-0566931 -- \
            src/pages/AssetPage.jsx \
            src/components/asset/AssetControls.jsx \
            src/pages/AssetPointZero.css \
            src/pages/InterventiPage.jsx \
            src/components/interventi/InterventiControls.jsx \
            src/pages/ScadenzePage.jsx \
            src/components/scadenze/ScadenzeControls.jsx \
            src/pages/InfrastrutturePage.jsx \
            src/components/infrastrutture/InfrastruttureControls.jsx \
            src/components/infrastrutture/InfrastrutturaEditor.jsx \
            src/pages/OperationsPointZero.css \
            src/Sicurezza8108Page.jsx \
            src/components/sicurezza8108/Sicurezza8108Controls.jsx \
            src/ProcessiPage.jsx \
            src/ImpostazioniPage.jsx \
            src/pages/GovernancePointZero.css

      - name: Applica protezioni alla base funzionale stabile
        if: steps.marker.outputs.done != 'true'
        run: node scripts/apply_pointzero_rebuild.mjs

      - name: Mantiene la firma Regola 0 nella cache
        if: steps.marker.outputs.done != 'true'
        shell: bash
        run: sed -i 's/fmed-rev0-punto0-rebuild/fmed-rev0-regola0-punto0-rebuild/' src/main.jsx

      - name: Marca la ricostruzione
        if: steps.marker.outputs.done != 'true'
        run: touch .fmed_pointzero_applied

      - name: Node 22
        if: steps.marker.outputs.done != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze pulite
        if: steps.marker.outputs.done != 'true'
        run: npm ci

      - name: Gate completo prima del salvataggio
        if: steps.marker.outputs.done != 'true'
        run: npm run check

      - name: Salva esclusivamente sul branch isolato
        if: steps.marker.outputs.done != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .fmed_pointzero_applied \
            src/main.jsx \
            src/PointZeroCompatibility.css \
            src/pages/AssetPage.jsx \
            src/components/asset/AssetControls.jsx \
            src/pages/AssetPointZero.css \
            src/pages/InterventiPage.jsx \
            src/components/interventi/InterventiControls.jsx \
            src/pages/ScadenzePage.jsx \
            src/components/scadenze/ScadenzeControls.jsx \
            src/pages/InfrastrutturePage.jsx \
            src/components/infrastrutture/InfrastruttureControls.jsx \
            src/components/infrastrutture/InfrastrutturaEditor.jsx \
            src/pages/OperationsPointZero.css \
            src/Sicurezza8108Page.jsx \
            src/components/sicurezza8108/Sicurezza8108Controls.jsx \
            src/ProcessiPage.jsx \
            src/ImpostazioniPage.jsx \
            src/pages/GovernancePointZero.css \
            scripts/apply_pointzero_rebuild.mjs \
            scripts/verify_regola0.mjs
          git commit -m "FMED REV0: ricostruzione Punto 0 integrale e sicura"
          git push origin HEAD:repair/rev0-regola0

      - name: Conferma isolamento
        run: |
          echo "Ricostruzione applicata o già presente sul solo branch repair/rev0-regola0."
          echo "Main e Production non sono stati modificati."

  controllo-1-integrita-funzionale:
    name: 1 · Integrità funzionale e struttura
    runs-on: ubuntu-latest
    needs: ricostruzione-punto-zero
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze pulite
        run: npm ci

      - name: Gate REV0
        run: npm run verify:rev0

      - name: Gate Regola 0
        run: npm run verify:regola0

      - name: Lint completo
        run: npm run lint

  controllo-2-integrita-grafica-build:
    name: 2 · Integrità grafica e build distribuibile
    runs-on: ubuntu-latest
    needs: controllo-1-integrita-funzionale
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze pulite
        run: npm ci

      - name: Build completa con prebuild e postbuild
        run: npm run build

      - name: Seconda verifica Regola 0 dopo la build
        run: npm run verify:regola0

      - name: Conserva build candidata
        uses: actions/upload-artifact@v4
        with:
          name: FMED_REV0_REGOLA0_DIST
          path: dist
          retention-days: 7

  controllo-3-rilascio-bloccante:
    name: 3 · Ricontrollo completo e blocco rilascio
    runs-on: ubuntu-latest
    needs:
      - controllo-1-integrita-funzionale
      - controllo-2-integrita-grafica-build
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze pulite
        run: npm ci

      - name: Gate finale completo
        run: npm run gate:regola0

      - name: Conferma produzione non modificata
        run: |
          echo "La pipeline valida soltanto la candidata."
          echo "Nessun merge su main e nessuna promozione Production sono eseguiti automaticamente."
          echo "Il rilascio resta subordinato al collaudo completo previsto da docs/REGOLA_0.md."
