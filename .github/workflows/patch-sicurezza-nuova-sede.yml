name: Patch Sicurezza nuova sede
on:
  push:
    branches: [rev0-sicurezza-nuova-sede]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[safety-site-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rev0-sicurezza-nuova-sede
          fetch-depth: 0
      - name: Patch UI nuova sede 81/08
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/Sicurezza8108Page.jsx')
          text = p.read_text(encoding='utf-8')

          anchor_helper = '\nclass Sicurezza8108ErrorBoundary extends Component {'
          helper = r'''

function cartellaSicurezzaDaMaster(site) {
  const codice = String(site?.codice || "").trim().toUpperCase();
  if (codice && !/^SED_\d+$/i.test(codice)) return codice;
  const label = normalizzaTesto(site?.etichetta || site?.label || codice).replace(/\s+/g, "_");
  return label || codice || "SEDE";
}
'''
          if anchor_helper not in text:
              raise SystemExit('anchor ErrorBoundary non trovato')
          text = text.replace(anchor_helper, helper + anchor_helper, 1)

          old_state = '''  const [categoria, setCategoria] = useState("TUTTE");
  const [showHistory, setShowHistory] = useState(false);
'''
          new_state = '''  const [categoria, setCategoria] = useState("TUTTE");
  const [showHistory, setShowHistory] = useState(false);
  const [newSiteOpen, setNewSiteOpen] = useState(false);
  const [masterSites, setMasterSites] = useState([]);
  const [selectedNewSite, setSelectedNewSite] = useState("");
  const [newSiteLoading, setNewSiteLoading] = useState(false);
  const [newSiteSaving, setNewSiteSaving] = useState(false);
'''
          if old_state not in text:
              raise SystemExit('anchor state non trovato')
          text = text.replace(old_state, new_state, 1)

          anchor_reset = '''  const resetFilters = () => {
    setSearch("");
    setSede("TUTTE");
    setCategoria("TUTTE");
  };
'''
          functions = r'''  const apriNuovaSede = useCallback(async () => {
    setNewSiteOpen(true);
    setNewSiteLoading(true);
    setError("");
    try {
      const base = String(apiBaseUrl || "").replace(/\/$/, "");
      const response = await fetch(`${base}/core/dizionari/amministrazione`, {
        headers: fmedAuthHeaders({ Accept: "application/json" }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload?.detail || "Master SEDI non disponibile");
      const dizionari = Array.isArray(payload?.dizionari) ? payload.dizionari : [];
      const dizionarioSedi = dizionari.find((item) => normalizzaTesto(item?.codice).replace(/\s+/g, "_") === "SEDI");
      const codiciAttivi = new Set(sedi.map((item) => String(item.codice || "").toUpperCase()));
      const disponibili = (Array.isArray(dizionarioSedi?.valori) ? dizionarioSedi.valori : [])
        .filter((item) => item?.attivo !== false)
        .filter((item) => String(item?.codice || "").toUpperCase() !== "SED_0001")
        .filter((item) => normalizzaTesto(item?.etichetta) !== "NON SPECIFICATA")
        .filter((item) => !codiciAttivi.has(String(item?.codice || "").toUpperCase()))
        .map((item) => ({ ...item, codice: String(item?.codice || "").toUpperCase() }));
      setMasterSites(disponibili);
      setSelectedNewSite(disponibili[0]?.codice || "");
    } catch (err) {
      setMasterSites([]);
      setSelectedNewSite("");
      setError(String(err?.message || err || "Impossibile leggere il Master SEDI"));
    } finally {
      setNewSiteLoading(false);
    }
  }, [apiBaseUrl, sedi]);

  const abilitaNuovaSede = useCallback(async () => {
    if (!selectedNewSite || newSiteSaving) return;
    const site = masterSites.find((item) => String(item?.codice || "") === selectedNewSite);
    if (!site?.id) return;
    setNewSiteSaving(true);
    setError("");
    try {
      const base = String(apiBaseUrl || "").replace(/\/$/, "");
      const cartella = cartellaSicurezzaDaMaster(site);
      const metadati = {
        ...(site?.metadati && typeof site.metadati === "object" ? site.metadati : {}),
        sicurezza_81_08_enabled: true,
        sicurezza_81_08_cartella: cartella,
        sicurezza_81_08_abilitata_il: new Date().toISOString(),
      };
      const response = await fetch(`${base}/core/dizionari/valori/${encodeURIComponent(site.id)}`, {
        method: "PATCH",
        headers: fmedAuthHeaders({ Accept: "application/json", "Content-Type": "application/json" }),
        body: JSON.stringify({ metadati }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload?.detail || "Abilitazione sede non riuscita");
      setSourceMessage(`${site.etichetta || site.codice} abilitata in Sicurezza 81/08. Cartella prevista: ${cartella}.`);
      setNewSiteOpen(false);
      setMasterSites([]);
      setSelectedNewSite("");
      await load({ silent: true });
    } catch (err) {
      setError(String(err?.message || err || "Abilitazione sede non riuscita"));
    } finally {
      setNewSiteSaving(false);
    }
  }, [apiBaseUrl, load, masterSites, newSiteSaving, selectedNewSite]);

'''
          if anchor_reset not in text:
              raise SystemExit('anchor reset non trovato')
          text = text.replace(anchor_reset, functions + anchor_reset, 1)

          old_header = '''        <header>
          <div><span className="p0-kicker">Mappa documentale</span><h2>Struttura SharePoint 81/08</h2><p>Le stesse sette categorie, organizzate per ogni sede.</p></div>
          {selectedSite && <a className="p0-btn p0-btn--safety" href={buildOpenUrl(selectedSite.codice)} target="_blank" rel="noreferrer">Apri {selectedSite.label}</a>}
        </header>
        <div className="p0-safety-sites">
'''
          new_header = '''        <header>
          <div><span className="p0-kicker">Mappa documentale</span><h2>Struttura SharePoint 81/08</h2><p>Le stesse sette categorie, organizzate per ogni sede.</p></div>
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            {selectedSite && <a className="p0-btn p0-btn--safety" href={buildOpenUrl(selectedSite.codice)} target="_blank" rel="noreferrer">Apri {selectedSite.label}</a>}
            <button type="button" className="p0-btn p0-btn--safety" onClick={apriNuovaSede}>+ NUOVA SEDE</button>
          </div>
        </header>
        {newSiteOpen && (
          <div className="p0-safety-notice" style={{ marginBottom: 12, alignItems: "flex-start" }}>
            <FmedIcon name="plus" />
            <div style={{ flex: 1 }}>
              <strong>Abilita una sede del Master FMED</strong>
              <span>La sede non viene duplicata: FMED usa l'anagrafica SEDI centrale e prepara le sette categorie 81/08.</span>
              <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginTop: 10 }}>
                <select className="p0-input" value={selectedNewSite} onChange={(event) => setSelectedNewSite(event.target.value)} disabled={newSiteLoading || newSiteSaving} style={{ minWidth: 280 }}>
                  {newSiteLoading ? <option value="">Lettura Master SEDI…</option> : null}
                  {!newSiteLoading && !masterSites.length ? <option value="">Nessuna nuova sede disponibile</option> : null}
                  {masterSites.map((item) => <option key={item.id || item.codice} value={item.codice}>{item.etichetta || item.codice}</option>)}
                </select>
                <button type="button" className="p0-btn p0-btn--safety" onClick={abilitaNuovaSede} disabled={!selectedNewSite || newSiteLoading || newSiteSaving}>{newSiteSaving ? "ABILITAZIONE…" : "ABILITA SEDE"}</button>
                <button type="button" className="p0-btn" onClick={() => setNewSiteOpen(false)} disabled={newSiteSaving}>ANNULLA</button>
              </div>
              {selectedNewSite && <small style={{ display: "block", marginTop: 8 }}>Cartella SharePoint prevista: <b>{cartellaSicurezzaDaMaster(masterSites.find((item) => item.codice === selectedNewSite))}</b>. Se non esiste ancora, va creata nella radice 13_SICUREZZA_81_08 prima di caricare i documenti.</small>}
            </div>
          </div>
        )}
        <div className="p0-safety-sites">
'''
          if old_header not in text:
              raise SystemExit('header mappa documentale non trovato')
          text = text.replace(old_header, new_header, 1)
          p.write_text(text, encoding='utf-8')
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Commit patch e pulizia workflow
        run: |
          git config user.name "FMED automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-sicurezza-nuova-sede.yml
          git add src/Sicurezza8108Page.jsx
          git commit -m "feat sicurezza 81/08: aggiunge nuova sede da Master SEDI [safety-site-ui]"
          git push origin HEAD:rev0-sicurezza-nuova-sede