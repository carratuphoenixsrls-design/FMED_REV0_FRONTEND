name: rev0-infrastrutture-final-polish
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch-and-build:
    if: github.event.pull_request.head.ref == 'rev0-infrastrutture-final-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rev0-infrastrutture-final-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply final Infrastructure polish
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/FmedApp.jsx')
          text = app.read_text(encoding='utf-8')
          old = 'const infraOk = infrastruttureFiltrate.filter((r) => r._statoInfra?.codice === "OK");'
          new = 'const infraOk = infrastruttureFiltrate.filter((r) => ["OK", "60_GIORNI"].includes(r._statoInfra?.codice));'
          assert text.count(old) == 1, f'infraOk occurrences: {text.count(old)}'
          app.write_text(text.replace(old, new), encoding='utf-8')

          controls = Path('src/components/infrastrutture/InfrastruttureControls.jsx')
          text = controls.read_text(encoding='utf-8')
          old = '<SelectField label="Stato" value={filtroInfraStato} onChange={(e) => setFiltroInfraStato(e.target.value)}><option value="TUTTE">Tutti gli stati</option><option value="SCADUTA">Scadute</option><option value="30_GIORNI">In scadenza</option><option value="OK">Programmate</option><option value="DA_VERIFICARE">Da verificare</option></SelectField>'
          new = '<SelectField label="Stato" value={filtroInfraStato} onChange={(e) => setFiltroInfraStato(e.target.value)}><option value="TUTTE">Tutti gli stati</option><option value="SCADUTA">Scadute</option><option value="30_GIORNI">In scadenza</option><option value="60_GIORNI">Entro 60 giorni</option><option value="OK">Programmate</option><option value="DUPLICATO">Duplicati</option><option value="DA_VERIFICARE">Da verificare</option></SelectField>'
          assert text.count(old) == 1, f'state select occurrences: {text.count(old)}'
          controls.write_text(text.replace(old, new), encoding='utf-8')

          css = Path('src/FmedUnifiedVisualSystem.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* REV0 INFRASTRUTTURE FINAL COMMAND BAR */'
          assert marker not in text, 'final command bar marker already present'
          text += '''\n\n/* REV0 INFRASTRUTTURE FINAL COMMAND BAR */\n.fmed-app-root.fmed-shell-premium .p0-operations--infrastructure .p0-infrastructure-command-bar {\n  display: grid;\n  grid-template-columns: repeat(5, minmax(0, 1fr));\n  gap: 8px;\n  overflow: visible;\n}\n.fmed-app-root.fmed-shell-premium .p0-operations--infrastructure .p0-infrastructure-command-bar > .p0-btn {\n  width: 100%;\n  min-width: 0;\n  margin: 0;\n  white-space: nowrap;\n}\n.fmed-app-root.fmed-shell-premium .p0-operations--infrastructure .p0-infrastructure-command-bar__reset {\n  position: static;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  visibility: visible;\n  opacity: 1;\n  transform: none;\n}\n@media (max-width: 1180px) {\n  .fmed-app-root.fmed-shell-premium .p0-operations--infrastructure .p0-infrastructure-command-bar {\n    grid-template-columns: repeat(3, minmax(0, 1fr));\n  }\n}\n@media (max-width: 800px) {\n  .fmed-app-root.fmed-shell-premium .p0-operations--infrastructure .p0-infrastructure-command-bar {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }\n}\n'''
          css.write_text(text, encoding='utf-8')
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Verify final Infrastructure rules
        shell: python
        run: |
          from pathlib import Path
          app = Path('src/FmedApp.jsx').read_text(encoding='utf-8')
          controls = Path('src/components/infrastrutture/InfrastruttureControls.jsx').read_text(encoding='utf-8')
          css = Path('src/FmedUnifiedVisualSystem.css').read_text(encoding='utf-8')
          assert '["OK", "60_GIORNI"].includes(r._statoInfra?.codice)' in app
          assert 'value="60_GIORNI">Entro 60 giorni' in controls
          assert 'value="DUPLICATO">Duplicati' in controls
          assert 'grid-template-columns: repeat(5, minmax(0, 1fr));' in css
          assert '.p0-infrastructure-command-bar__reset' in css
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/rev0-infrastrutture-final-polish.yml
          git config user.name "FMED REV0 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/FmedApp.jsx src/components/infrastrutture/InfrastruttureControls.jsx src/FmedUnifiedVisualSystem.css .github/workflows/rev0-infrastrutture-final-polish.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "REV0 Infrastrutture: collaudo finale UI"
          git push origin HEAD:rev0-infrastrutture-final-polish
