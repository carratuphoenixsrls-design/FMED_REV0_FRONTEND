name: Fix stati ciclo definitivi frontend

on:
  push:
    branches:
      - fix-stati-ciclo-definitivi

permissions:
  contents: write

jobs:
  fix-build-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-stati-ciclo-definitivi
          fetch-depth: 0
      - name: Applica regole ciclo
        run: python scripts/fix_stati_ciclo_definitivi.py
      - name: Build REV0
        run: |
          npm ci
          npm run build
      - name: Commit pulito
        run: |
          rm -f scripts/fix_stati_ciclo_definitivi.py
          rm -f .github/workflows/fix-stati-ciclo-definitivi.yml
          rm -f .fix-stati-ciclo-trigger
          git config user.name "FMED REV0 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/InterventiPage.jsx scripts/fix_stati_ciclo_definitivi.py .github/workflows/fix-stati-ciclo-definitivi.yml .fix-stati-ciclo-trigger
          git commit -m "REV0 Interventi: stati ciclo definitivi"
          git push origin HEAD:fix-stati-ciclo-definitivi
