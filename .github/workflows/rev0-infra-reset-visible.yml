name: rev0-infra-reset-visible
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply focused layout fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/infrastrutture/InfrastruttureControls.jsx')
          s = p.read_text(encoding='utf-8')
          old = '''      <div
        className="p0-command__actions p0-infrastructure-command-bar"
        role="toolbar"
        aria-label="Comandi infrastrutture"
      >'''
          new = '''      <div
        className="p0-command__actions p0-infrastructure-command-bar"
        role="toolbar"
        aria-label="Comandi infrastrutture"
        style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))", gap: "8px", overflow: "visible" }}
      >'''
          if old not in s:
              raise SystemExit('command bar target not found')
          s = s.replace(old, new, 1)
          old2 = '''<button
          type="button"
          className="p0-btn p0-infrastructure-command-bar__reset"
          onClick={resetFiltriInfrastrutture}
        >'''
          new2 = '''<button
          type="button"
          className="p0-btn p0-infrastructure-command-bar__reset"
          onClick={resetFiltriInfrastrutture}
          style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", position: "static", visibility: "visible", opacity: 1, width: "100%", minWidth: 0, margin: 0 }}
        >'''
          if old2 not in s:
              raise SystemExit('reset target not found')
          p.write_text(s.replace(old2, new2, 1), encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit functional fix and remove workflow
        if: success()
        run: |
          git config user.name "FMED REV0 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/infrastrutture/InfrastruttureControls.jsx
          git commit -m "fix infrastrutture: azzera filtri sempre visibile" || true
          git rm .github/workflows/rev0-infra-reset-visible.yml
          git commit -m "chore: rimuove collaudo temporaneo" || true
          git push origin HEAD:${{ github.head_ref }}
