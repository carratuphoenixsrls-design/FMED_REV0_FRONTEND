name: Facility source scope fix verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-build-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rev0-facility-source-of-truth
          fetch-depth: 0
      - name: Corregge perimetro fonte unica
        run: python scripts/fix_facility_source_scope.py
      - name: Build completa REV0
        run: |
          npm ci
          npm run build
      - name: Commit finale pulito
        run: |
          rm -f scripts/fix_facility_source_scope.py
          rm -f .github/workflows/facility-scope-fix-pr.yml
          git config user.name "FMED REV0 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/FmedApp.jsx scripts/fix_facility_source_scope.py .github/workflows/facility-scope-fix-pr.yml
          git commit -m "REV0 Facility: Asset resta fonte editabile, contesti coerenti"
          git push origin HEAD:rev0-facility-source-of-truth
