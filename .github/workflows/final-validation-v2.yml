name: FMED Final Validation V2

on:
  push:
    branches:
      - repair/rev0-regola0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmed-final-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-validation:
    name: Regola 0 · Build · Browser · Screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze pulite
        run: npm ci

      - name: Gate funzionale e grafico
        run: npm run gate:regola0

      - name: Build reale
        run: npm run build

      - name: Audit distribuzione reale
        run: node scripts/verify_dist_pointzero.mjs

      - name: Conserva build reale
        uses: actions/upload-artifact@v4
        with:
          name: FMED_REV0_FINAL_REAL_DIST
          path: dist
          retention-days: 7

      - name: Rende univoco Nuovo asset nel collaudo
        shell: bash
        run: sed -i 's/{ name: "Nuovo asset" }/{ name: "Nuovo asset", exact: true }/' qa/pointzero_e2e.mjs

      - name: Playwright
        run: npm install --no-save playwright@1.54.2

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Build QA isolata
        env:
          VITE_API_BASE_URL: https://qa.fmed.invalid
        run: npm run build

      - name: Preview QA
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/fmed-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fmed-preview.log
          exit 1

      - name: Browser su tre risoluzioni e funzioni complete
        env:
          FMED_QA_URL: http://127.0.0.1:4173
          FMED_QA_OUTPUT: qa-results
        run: node qa/pointzero_e2e.mjs

      - name: Conserva audit browser
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FMED_REV0_FINAL_BROWSER_QA
          path: qa-results
          retention-days: 7

      - name: Log errore Preview
        if: failure()
        run: cat /tmp/fmed-preview.log || true

      - name: Registra esito sul branch isolato
        if: always()
        env:
          VALIDATION_STATUS: ${{ job.status }}
          VALIDATED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          mkdir -p docs
          PASSED="n.d."
          FAILED="n.d."
          if [ -f qa-results/report.json ]; then
            PASSED=$(node -p "require('./qa-results/report.json').passed ?? 'n.d.'")
            FAILED=$(node -p "require('./qa-results/report.json').failed ?? 'n.d.'")
          fi
          cat > docs/FINAL_VALIDATION_RESULT.md <<EOF
          # FMED REV0 · Esito validazione finale

          - Esito workflow: **${VALIDATION_STATUS}**
          - Commit verificato: \`${VALIDATED_SHA}\`
          - Run GitHub Actions: \`${RUN_ID}\`
          - Controlli browser superati: **${PASSED}**
          - Controlli browser falliti: **${FAILED}**
          - Data UTC: **$(date -u +'%Y-%m-%d %H:%M:%S')**

          Il risultato è stato generato automaticamente dal workflow isolato. Main e Production non sono stati modificati.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FINAL_VALIDATION_RESULT.md
          git commit -m "FMED REV0: esito validazione finale ${VALIDATION_STATUS}" || exit 0
          git push origin HEAD:repair/rev0-regola0
