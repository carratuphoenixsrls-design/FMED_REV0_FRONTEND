name: Facility final verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  final-build-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rev0-facility-source-of-truth
          fetch-depth: 0
      - name: Rifinitura fonte unica
        run: python scripts/final_facility_cleanup.py
      - name: Build completa REV0
        run: |
          npm ci
          npm run build
      - name: Commit finale pulito
        run: |
          rm -f scripts/final_facility_cleanup.py
          rm -f .github/workflows/facility-final-pr.yml
          git config user.name "FMED REV0 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/FmedApp.jsx scripts/final_facility_cleanup.py .github/workflows/facility-final-pr.yml
          git commit -m "REV0 Facility: master data e asset governano le anagrafiche"
          git push origin HEAD:rev0-facility-source-of-truth
