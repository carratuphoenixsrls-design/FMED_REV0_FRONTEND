name: Fix Interventi tipologia modifica

on:
  push:
    branches:
      - fix-interventi-tipologia-modifica-2

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Applica correzione tipologia modifica intervento
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/FmedApp.jsx')
          text = path.read_text(encoding='utf-8')
          old = '''    const datiDaSalvare = {\n      codice_strumento: formModificaIntervento.codice_strumento || null,\n      sede: formModificaIntervento.sede || null,\n      tipologia: formModificaIntervento.tipologia || null,\n      attivita: formModificaIntervento.attivita || null,\n'''
          new = '''    const datiDaSalvare = {\n      codice_strumento: formModificaIntervento.codice_strumento || null,\n      sede: formModificaIntervento.sede || null,\n      // La tipologia appartiene al cespite, non al record intervento.\n      // Non va validata/salvata come TIPOLOGIE_INTERVENTO nel PUT.\n      tipologia: null,\n      attivita: formModificaIntervento.attivita || null,\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Blocco modifica intervento: attesa 1 occorrenza, trovate {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          print('OK - tipologia esclusa dal payload di modifica intervento')
          PY

      - name: Build REV0
        run: |
          npm ci
          npm run build

      - name: Commit pulito
        shell: bash
        run: |
          rm -f .github/workflows/fix-interventi-tipologia-modifica.yml
          git config user.name "FMED REV0 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/FmedApp.jsx .github/workflows/fix-interventi-tipologia-modifica.yml
          git commit -m "fix interventi: tipologia asset esclusa dalla modifica"
          git push origin HEAD:fix-interventi-tipologia-modifica-2
