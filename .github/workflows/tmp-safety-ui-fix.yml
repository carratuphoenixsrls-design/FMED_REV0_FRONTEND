name: tmp-safety-ui-fix
on:
  push:
    branches: [fix-sicurezza8108-kpi-classificazione]
permissions:
  contents: write
jobs:
  patch-build-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-sicurezza8108-kpi-classificazione
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Patch KPI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/Sicurezza8108Page.jsx')
          s=p.read_text(encoding='utf-8')
          old='''  const unclassifiedCount = documenti.filter((doc) => !doc?.sede || !doc?.categoria).length;'''
          new='''  const unclassifiedCount = documenti.filter(\n    (doc) => !doc?.is_cartella && (!doc?.sede || !doc?.categoria)\n  ).length;'''
          if old not in s:
              raise SystemExit('KPI Da classificare non trovato')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Remove temporary workflow
        run: rm -f .github/workflows/tmp-safety-ui-fix.yml
      - name: Commit patch
        run: |
          git config user.name carratuphoenixsrls-design
          git config user.email carratu.phoenixsrls@gmail.com
          git add src/Sicurezza8108Page.jsx .github/workflows/tmp-safety-ui-fix.yml
          git commit -m "fix sicurezza 81/08: KPI classificazione documenti" || true
          git push origin HEAD:fix-sicurezza8108-kpi-classificazione
